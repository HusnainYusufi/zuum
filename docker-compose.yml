version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-freight-backend
    ports:
      - "8000:8000"
      - "4040:4040"
      - "5678:5678"  # Debug port
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NGROK_AUTH_TOKEN=${NGROK_AUTH_TOKEN}
      - RETELL_API_KEY=${RETELL_API_KEY}
      - DATABASE_URL=sqlite:///./data/transit.db
      - WORKFLOW_RETELL_AGENT_ID=${WORKFLOW_RETELL_AGENT_ID}
      - CHECKIN_RETELL_AGENT_ID=${CHECKIN_RETELL_AGENT_ID}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount source code for development
      - .:/app
      # Preserve database
      - ./transit.db:/app/data/transit.db
      - backend_data:/app/data
    networks:
      - voice-freight-network
    restart: unless-stopped
    command: ["python", "main.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  voice-freight-network:
    driver: bridge

volumes:
  backend_data:
    driver: local 