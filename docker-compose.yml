version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: jimc047/voice_freight_broker:latest
    container_name: voice-freight-broker
    ports:
      - "8000:8000"
      - "4040:4040"
      - "5678:5678"  # Debug port
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NGROK_AUTH_TOKEN=${NGROK_AUTH_TOKEN}
      - RETELL_API_KEY=${RETELL_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - WORKFLOW_RETELL_AGENT_ID=${WORKFLOW_RETELL_AGENT_ID}
      - CHECKIN_RETELL_AGENT_ID=${CHECKIN_RETELL_AGENT_ID}
      - INBOUND_CALL_AGENT_ID=${INBOUND_CALL_AGENT_ID}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BACKEND_ngrok_LINK=${BACKEND_ngrok_LINK}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - API_RATE_LIMIT=${API_RATE_LIMIT:-100}
      - RETELL_FROM_NUMBER=${RETELL_FROM_NUMBER}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      - FEEDBACK_RECIPIENT_PHONES=${FEEDBACK_RECIPIENT_PHONES}
      - FEEDBACK_SENDER_EMAIL=${FEEDBACK_SENDER_EMAIL}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FEEDBACK_RECIPIENT_EMAIL=${FEEDBACK_RECIPIENT_EMAIL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - SECRET_KEY=${SECRET_KEY}
      - BASE_URL=
    volumes:
      - .:/app
      - ./transit.db:/app/data/transit.db
      - ./static/feedback-images:/app/static/feedback-images
      - backend_data:/app/data
    networks:
      - voice-freight-network
    restart: unless-stopped
    command: ["python", "main.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  voice-freight-network:
    driver: bridge

volumes:
  backend_data:
    driver: local
