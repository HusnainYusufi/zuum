name: Build and Deploy to DigitalOcean

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate unique image tag
        id: tag
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="staging-${TIMESTAMP}-${COMMIT_SHORT}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "FULL_IMAGE_NAME=jimc047/voice_freight_broker:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${IMAGE_TAG}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jimc047
          password: Abdulhadi3035

      - name: Build and push Docker image
        run: |
          # Build the image with unique tag
          docker build -t ${{ steps.tag.outputs.FULL_IMAGE_NAME }} .
          
          # Also tag as latest for staging
          docker tag ${{ steps.tag.outputs.FULL_IMAGE_NAME }} jimc047/voice_freight_broker:staging-latest
          
          # Push both tags to Docker Hub
          docker push ${{ steps.tag.outputs.FULL_IMAGE_NAME }}
          docker push jimc047/voice_freight_broker:staging-latest
          
          echo "Successfully pushed image: ${{ steps.tag.outputs.FULL_IMAGE_NAME }}"

      - name: Copy docker-compose.yml to DigitalOcean Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.193.18
          username: root
          password: e3capital@AI
          port: 22
          source: "docker-compose.yml"
          target: "/root/"

      - name: Deploy on DigitalOcean Droplet
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 137.184.193.18
          username: root
          password: e3capital@AI
          port: 22
          script: |
            echo "Starting deployment for voice-freight-broker..."
            echo "Deploying image: ${{ steps.tag.outputs.FULL_IMAGE_NAME }}"
            
            # Create .env file with all environment variables
            cat > /root/.env << 'EOF'
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            NGROK_AUTH_TOKEN=${{ secrets.NGROK_AUTH_TOKEN }}
            RETELL_API_KEY=key_604f51d09f7f3313ba0f83d7bc63
            DATABASE_URL=sqlite:///./data/transit.db
            WORKFLOW_RETELL_AGENT_ID=agent_6b16ffe7f0177a02f4fd2ebf72
            CHECKIN_RETELL_AGENT_ID=agent_6e445fc10ee5db15ae0b442067
            INBOUND_CALL_AGENT_ID=${{ secrets.INBOUND_CALL_AGENT_ID }}
            ENVIRONMENT=production
            LOG_LEVEL=INFO
            BACKEND_ngrok_LINK=sawfly-relaxing-dog.ngrok-free.app
