            SMTP_PASSWORD=fyzc ovuo jeyy kyty
            FEEDBACK_RECIPIENT_EMAIL=saswat@coreedgesolution.com
            TWILIO_ACCOUNT_SID=AC9aac0ea30c2d13ba63d7b9833021cbca
            TWILIO_AUTH_TOKEN=bef96b283c66f17c9fc594d15a888a9c
            TWILIO_FROM_NUMBER=+1540446-2709
            FEEDBACK_RECIPIENT_PHONES=+16084404374
            SUPABASE_URL=https://jiugpwfdwvewmrryiqpt.supabase.co
            SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppdWdwd2Zkd3Zld21ycnlpcXB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIwOTI4NTEsImV4cCI6MjA2NzY2ODg1MX0.gQiXUdzio-96-QO11RR68cFf_DDs_rx886My_8nbpYU
            ADMIN_PASSWORD_HASH=$2b$12$hr7nNNqrLgWq0oFpwNTjG.jBRY4JsYdwk.6cxWOppy7GivZuTuVdu
