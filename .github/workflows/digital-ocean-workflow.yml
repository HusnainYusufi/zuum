name: Build and Deploy to DigitalOcean

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Build Docker image
        run: |
          # Build the image using docker-compose
          docker-compose -f docker-compose.yml build backend
          
          # Save the image to tar file for transfer
          docker save -o voice_freight_broker_image.tar jimc047/voice_freight_broker:latest

      - name: Copy Docker image to DigitalOcean Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 167.172.141.198
          username: root
          password: ${{ secrets.DO_DROPLET_PASSWORD }}
          port: 22
          source: "voice_freight_broker_image.tar"
          target: "/root/voice_freight_broker_image.tar"

      - name: Deploy on DigitalOcean Droplet
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 167.172.141.198
          username: root
          password: ${{ secrets.DO_DROPLET_PASSWORD }}
          port: 22
          script: |
            echo "Starting deployment for voice-freight-broker..."
            
            # Stop and remove existing container
            docker stop voice-freight-broker || true
            docker rm voice-freight-broker || true
            
            # Remove old image
            docker rmi jimc047/voice_freight_broker:latest || true
            
            # Load new image
            docker load -i /root/voice_freight_broker_image.tar
            
            # Run new container with same configuration as docker-compose
            docker run -d \
              --name voice-freight-broker \
              --restart unless-stopped \
              -p 8000:8000 \
              -p 4040:4040 \
              -p 5678:5678 \
              -e PYTHONPATH=/app \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e NGROK_AUTH_TOKEN="${{ secrets.NGROK_AUTH_TOKEN }}" \
              -e RETELL_API_KEY="${{ secrets.RETELL_API_KEY }}" \
              -e DATABASE_URL="sqlite:///./data/transit.db" \
              -e WORKFLOW_RETELL_AGENT_ID="${{ secrets.WORKFLOW_RETELL_AGENT_ID }}" \
              -e CHECKIN_RETELL_AGENT_ID="${{ secrets.CHECKIN_RETELL_AGENT_ID }}" \
              -e INBOUND_CALL_AGENT_ID="${{ secrets.INBOUND_CALL_AGENT_ID }}" \
              -e ENVIRONMENT="production" \
              -e LOG_LEVEL="INFO" \
              -e BACKEND_ngrok_LINK="sawfly-relaxing-dog.ngrok-free.app" \
              -e ALLOWED_ORIGINS="*" \
              -e API_RATE_LIMIT="100" \
              -e RETELL_FROM_NUMBER="${{ secrets.RETELL_FROM_NUMBER }}" \
              -e FEEDBACK_SENDER_EMAIL="${{ secrets.FEEDBACK_SENDER_EMAIL }}" \
              -e SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}" \
              -e SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
              -e FEEDBACK_RECIPIENT_EMAIL="${{ secrets.FEEDBACK_RECIPIENT_EMAIL }}" \
              -e TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
              -e TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}" \
              -e TWILIO_FROM_NUMBER="${{ secrets.TWILIO_FROM_NUMBER }}" \
              -e FEEDBACK_RECIPIENT_PHONES="${{ secrets.FEEDBACK_RECIPIENT_PHONES }}" \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
              -e ADMIN_PASSWORD_HASH="${{ secrets.ADMIN_PASSWORD_HASH }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              -v /root/data:/app/data \
              -v /root/feedback-images:/app/static/feedback-images \
              jimc047/voice_freight_broker:latest
            
            # Clean up tar file
            rm -f /root/voice_freight_broker_image.tar
            
            echo "Deployment completed successfully!"
            echo "Container status:"
            docker ps --filter name=voice-freight-broker
