name: Build and Deploy to DigitalOcean

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: env

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate unique image tag
        id: tag
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="staging-${TIMESTAMP}-${COMMIT_SHORT}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "FULL_IMAGE_NAME=jimc047/voice_freight_broker:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${IMAGE_TAG}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jimc047
          password: Abdulhadi3035

      - name: Build and push Docker image
        run: |
          # Build the image with unique tag
          docker build -t ${{ steps.tag.outputs.FULL_IMAGE_NAME }} .
          
          # Also tag as latest for staging
          docker tag ${{ steps.tag.outputs.FULL_IMAGE_NAME }} jimc047/voice_freight_broker:staging-latest
          
          # Push both tags to Docker Hub
          docker push ${{ steps.tag.outputs.FULL_IMAGE_NAME }}
          docker push jimc047/voice_freight_broker:staging-latest
          
          echo "Successfully pushed image: ${{ steps.tag.outputs.FULL_IMAGE_NAME }}"

      - name: Deploy on DigitalOcean Droplet
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 137.184.193.18
          username: root
          password: e3capital@AI
          port: 22
          script: |
            echo "Starting deployment for voice-freight-broker..."
            echo "Deploying image: ${{ steps.tag.outputs.FULL_IMAGE_NAME }}"
            
            # Stop and remove existing container
            docker stop voice-freight-broker || true
            docker rm voice-freight-broker || true
            
            # Remove old images to free up space
            docker images | grep "jimc047/voice_freight_broker" | awk '{print $3}' | xargs -r docker rmi -f || true
            
            # Pull the new image from Docker Hub
            docker pull ${{ steps.tag.outputs.FULL_IMAGE_NAME }}
            
            # Verify the image was pulled correctly
            docker images | grep "jimc047/voice_freight_broker"
            
            # Run new container with the uniquely tagged image
            docker run -d \
              --env-file .env \
              --name voice-freight-broker \
              -p 8000:8000 \
              -p 4040:4040 \
              -p 5678:5678 \
              -e PYTHONPATH=/app \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e NGROK_AUTH_TOKEN="${{ secrets.NGROK_AUTH_TOKEN }}" \
              -e RETELL_API_KEY="${{ secrets.RETELL_API_KEY }}" \
              -e DATABASE_URL="sqlite:///./data/transit.db" \
              -e WORKFLOW_RETELL_AGENT_ID="${{ secrets.WORKFLOW_RETELL_AGENT_ID }}" \
              -e CHECKIN_RETELL_AGENT_ID="${{ secrets.CHECKIN_RETELL_AGENT_ID }}" \
              -e INBOUND_CALL_AGENT_ID="${{ secrets.INBOUND_CALL_AGENT_ID }}" \
              -e ENVIRONMENT="production" \
              -e LOG_LEVEL="INFO" \
              -e BACKEND_ngrok_LINK="sawfly-relaxing-dog.ngrok-free.app" \
              -e ALLOWED_ORIGINS="*" \
              -e API_RATE_LIMIT="100" \
              -e RETELL_FROM_NUMBER="${{ secrets.RETELL_FROM_NUMBER }}" \
              -e FEEDBACK_SENDER_EMAIL="${{ secrets.FEEDBACK_SENDER_EMAIL }}" \
              -e SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}" \
              -e SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
              -e FEEDBACK_RECIPIENT_EMAIL="${{ secrets.FEEDBACK_RECIPIENT_EMAIL }}" \
              -e TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
              -e TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}" \
              -e TWILIO_FROM_NUMBER="${{ secrets.TWILIO_FROM_NUMBER }}" \
              -e FEEDBACK_RECIPIENT_PHONES="${{ secrets.FEEDBACK_RECIPIENT_PHONES }}" \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
              -e ADMIN_PASSWORD_HASH="${{ secrets.ADMIN_PASSWORD_HASH }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              -v /root/data:/app/data \
              -v /root/feedback-images:/app/static/feedback-images \
              ${{ steps.tag.outputs.FULL_IMAGE_NAME }}
            
            echo "Deployment completed successfully!"
            echo "Deployed image: ${{ steps.tag.outputs.FULL_IMAGE_NAME }}"
            echo "Container status:"
            docker ps --filter name=voice-freight-broker
            
            # Show container logs to verify it started correctly
            echo "Container logs (last 20 lines):"
            docker logs --tail 20 voice-freight-broker
