[tool.black]
line-length = 170
target-version = ['py38']
preview = true
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | frontend
  | node_modules
  | \.next
  | static
  | templates
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 170
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
