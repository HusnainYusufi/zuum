<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Check-ins - Voice Freight Broker</title>
    <link rel="stylesheet" href="/static/css/checkin_dashboard.css">
    <link rel="stylesheet" href="/static/css/all_checkin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/all_checkin.js"></script>
</head>
<body>
    <div class="all-checkins-container">
        <!-- Header -->
        <div class="all-checkins-header">
            <h1 class="all-checkins-title">
                <i class="fas fa-clipboard-list"></i>
                All Check-ins
            </h1>
            <a href="/dashboard" class="back-button">
                <i class="fas fa-arrow-left"></i>
                Back to Dashboard
            </a>
        </div>

        <!-- Filters -->
        <div class="all-checkins-filters">
            <div class="filter-group">
                <label class="filter-label">Filter by Call Status</label>
                <select class="filter-input" id="call-status-filter">
                    <option value="">All Calls</option>
                    <option value="answered">Call Answered</option>
                    <option value="not_answered">Call Not Answered</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Filter by Issue Status</label>
                <select class="filter-input" id="issue-filter">
                    <option value="">All</option>
                    <option value="true">Issues Only</option>
                    <option value="false">No Issues</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Filter by Transfer Status</label>
                <select class="filter-input" id="review-filter">
                    <option value="">All</option>
                    <option value="true">Call Transferred</option>
                    <option value="false">Not Transferred</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Sort by Time</label>
                <select class="filter-input" id="time-filter">
                    <option value="desc">Newest First</option>
                    <option value="asc">Oldest First</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Search Tags</label>
                <input type="text" class="filter-input" id="tags-filter" placeholder="Enter tag name...">
            </div>
            <div class="filter-group">
                <label class="filter-label">Search by Name</label>
                <input type="text" class="filter-input" id="name-filter" placeholder="Enter trucker name...">
            </div>
            <div class="filter-group">
                <label class="filter-label">Search by Phone</label>
                <input type="text" class="filter-input" id="phone-filter" placeholder="Enter phone number...">
            </div>
            <div class="filter-group">
                <label class="filter-label">Search by Load ID</label>
                <input type="text" class="filter-input" id="load-id-filter" placeholder="Enter load ID...">
            </div>
        </div>

        <!-- Check-ins List -->
        <div class="all-checkins-list">
            <div class="all-checkins-content" id="checkins-content">
                <p class="no-check-ins">Loading check-ins...</p>
            </div>
            <div class="all-checkins-pagination" id="pagination">
                <!-- Pagination buttons will be generated by JavaScript -->
            </div>
        </div>
    </div>
</body>
</html>
