<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Form Configuration Manager</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			:root {
				--primary-color: #6366f1;
				--primary-dark: #4f46e5;
				--primary-light: #818cf8;
				--secondary-color: #8b5cf6;
				--success-color: #10b981;
				--danger-color: #ef4444;
				--warning-color: #f59e0b;
				--background: #f8fafc;
				--surface: #ffffff;
				--border-color: #e5e7eb;
				--text-primary: #1f2937;
				--text-secondary: #6b7280;
				--shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
				--shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
					0 2px 4px -1px rgba(0, 0, 0, 0.06);
				--shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
					0 4px 6px -2px rgba(0, 0, 0, 0.05);
				--shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
					0 10px 10px -5px rgba(0, 0, 0, 0.04);
				--radius-sm: 0.375rem;
				--radius-md: 0.5rem;
				--radius-lg: 0.75rem;
				--radius-xl: 1rem;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
					"Helvetica Neue", Arial, sans-serif;
				background-color: var(--background);
				color: var(--text-primary);
				line-height: 1.6;
				overflow-x: hidden;
			}

			/* Loading Overlay */
			.loading {
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(255, 255, 255, 0.9);
				z-index: 1000;
				justify-content: center;
				align-items: center;
				flex-direction: column;
			}

			.loading-spinner {
				width: 50px;
				height: 50px;
				border: 4px solid var(--border-color);
				border-top: 4px solid var(--primary-color);
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			/* Main Layout */
			.container {
				max-width: 1400px;
				margin: 0 auto;
				padding: 2rem;
			}

			.header {
				text-align: center;
				margin-bottom: 3rem;
			}

			.header-title {
				font-size: 2.5rem;
				font-weight: 700;
				color: var(--text-primary);
				margin-bottom: 0.5rem;
			}

			.header-subtitle {
				font-size: 1.125rem;
				color: var(--text-secondary);
			}

			/* Form Selector */
			.form-selector-section {
				background: var(--surface);
				border-radius: var(--radius-lg);
				padding: 1.5rem;
				margin-bottom: 2rem;
				box-shadow: var(--shadow-sm);
				border: 1px solid var(--border-color);
			}

			.form-selector-container {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 1rem;
			}

			.form-selector-wrapper {
				display: flex;
				align-items: center;
				gap: 0.75rem;
			}

			.form-selector-label {
				font-weight: 600;
				color: var(--text-primary);
				font-size: 1rem;
			}

			.form-selector-select {
				padding: 0.75rem 1rem;
				border: 2px solid var(--border-color);
				border-radius: var(--radius-md);
				background: var(--surface);
				color: var(--text-primary);
				font-size: 1rem;
				min-width: 200px;
				transition: all 0.2s ease;
			}

			.form-selector-select:focus {
				outline: none;
				border-color: var(--primary-color);
				box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
			}

			.form-info-inline {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				color: var(--text-secondary);
				font-size: 0.875rem;
			}

			.form-info-inline-icon {
				width: 1rem;
				height: 1rem;
			}

			/* Grid Layout */
			.main-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 2rem;
				margin-bottom: 2rem;
			}

			@media (max-width: 1024px) {
				.main-grid {
					grid-template-columns: 1fr;
				}
			}

			/* Panel Styles */
			.panel {
				background: var(--surface);
				border-radius: var(--radius-lg);
				box-shadow: var(--shadow-md);
				border: 1px solid var(--border-color);
				overflow: hidden;
				display: flex;
				flex-direction: column;
			}

			.panel-header {
				background: linear-gradient(
					135deg,
					var(--primary-color),
					var(--primary-dark)
				);
				color: white;
				padding: 1.5rem;
				border-bottom: 1px solid rgba(255, 255, 255, 0.1);
				flex-shrink: 0;
			}

			.panel-title {
				font-size: 1.25rem;
				font-weight: 600;
				display: flex;
				align-items: center;
				gap: 0.75rem;
			}

			.panel-body {
				padding: 1.5rem;
				flex: 1;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}

			/* Panel body with scrollable content */
			.voice-questions-panel .panel-body,
			.json-config-panel .panel-body {
				max-height: 600px;
				overflow: hidden;
			}

			.icon-sm {
				width: 1rem;
				height: 1rem;
			}

			.icon-md {
				width: 1.5rem;
				height: 1.5rem;
			}

			/* Fields Panel Styles - COMPACT */
			.fields-panel {
				grid-column: 1 / -1;
				margin-bottom: 1rem;
			}

			.fields-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
				gap: 0.75rem;
				margin-bottom: 1rem;
			}

			.field-card {
				background: #f8fafc;
				border: 1px solid var(--border-color);
				border-radius: var(--radius-sm);
				padding: 0.75rem;
				transition: all 0.2s ease;
				font-size: 0.875rem;
			}

			.field-card:hover {
				border-color: var(--primary-color);
				box-shadow: var(--shadow-sm);
			}

			.field-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 0.5rem;
			}

			.field-name {
				font-weight: 600;
				color: var(--text-primary);
				font-size: 0.8rem;
			}

			.field-required {
				background: var(--danger-color);
				color: white;
				padding: 0.1rem 0.4rem;
				border-radius: 9999px;
				font-size: 0.65rem;
				font-weight: 500;
			}

			.field-optional {
				background: var(--text-secondary);
				color: white;
				padding: 0.1rem 0.4rem;
				border-radius: 9999px;
				font-size: 0.65rem;
				font-weight: 500;
			}

			.field-details {
				display: grid;
				gap: 0.25rem;
			}

			.field-detail {
				display: flex;
				justify-content: space-between;
				font-size: 0.75rem;
			}

			.field-detail-label {
				color: var(--text-secondary);
				font-weight: 500;
			}

			.field-detail-value {
				color: var(--text-primary);
				font-weight: 600;
			}

			.field-type-select {
				background: var(--primary-color);
				color: white;
				padding: 0.1rem 0.4rem;
				border-radius: var(--radius-sm);
				font-size: 0.65rem;
			}

			/* JSON Editor */
			.json-editor {
				width: 100%;
				height: 400px;
				font-family: "Monaco", "Menlo", "Ubuntu Mono", monospace;
				font-size: 0.875rem;
				line-height: 1.6;
				padding: 1.25rem;
				border: 1px solid var(--border-color);
				border-radius: var(--radius-md);
				background: #1e293b;
				color: #e2e8f0;
				resize: none;
				overflow-y: auto;
			}

			.json-editor:focus {
				outline: none;
				border-color: var(--primary-color);
				box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
			}

			/* Voice Questions - SCROLLABLE */
			.questions-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 1rem;
				padding-bottom: 1rem;
				border-bottom: 1px solid var(--border-color);
				flex-shrink: 0;
			}

			.questions-info {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				color: var(--text-secondary);
				font-size: 0.875rem;
			}

			.add-question-btn {
				background: var(--primary-color);
				color: white;
				border: none;
				padding: 0.75rem 1rem;
				border-radius: var(--radius-md);
				font-weight: 500;
				display: flex;
				align-items: center;
				gap: 0.5rem;
				cursor: pointer;
				transition: all 0.2s ease;
			}

			.add-question-btn:hover {
				background: var(--primary-dark);
				transform: translateY(-1px);
				box-shadow: var(--shadow-md);
			}

			.questions-container {
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
				flex: 1;
				overflow-y: auto;
				margin-bottom: 1rem;
				max-height: 350px;
			}

			.question-chip {
				background: var(--surface);
				border: 1px solid var(--border-color);
				border-radius: var(--radius-md);
				padding: 1rem;
				cursor: move;
				transition: all 0.2s ease;
				position: relative;
			}

			.question-chip:hover {
				border-color: var(--primary-color);
				box-shadow: var(--shadow-sm);
			}

			.question-chip.dragging {
				opacity: 0.5;
				transform: rotate(2deg);
			}

			.question-chip.drag-over {
				border-color: var(--success-color);
				background: rgba(16, 185, 129, 0.05);
			}

			.question-content {
				display: flex;
				align-items: center;
				gap: 0.75rem;
			}

			.question-number {
				background: var(--primary-color);
				color: white;
				width: 1.5rem;
				height: 1.5rem;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 0.75rem;
				font-weight: 600;
				flex-shrink: 0;
			}

			.question-text {
				flex: 1;
				font-size: 0.875rem;
				line-height: 1.4;
			}

			.question-actions {
				display: flex;
				gap: 0.5rem;
			}

			.btn-icon {
				background: none;
				border: none;
				padding: 0.5rem;
				border-radius: var(--radius-sm);
				cursor: pointer;
				transition: all 0.2s ease;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.btn-icon:hover {
				background: var(--border-color);
			}

			.btn-icon.edit {
				color: var(--primary-color);
			}

			.btn-icon.delete {
				color: var(--danger-color);
			}

			/* Buttons */
			.btn {
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
				padding: 0.5rem 1rem;
				border: none;
				border-radius: var(--radius-md);
				font-weight: 500;
				text-decoration: none;
				cursor: pointer;
				transition: all 0.2s ease;
				font-size: 0.875rem;
			}

			.btn-primary {
				background: var(--primary-color);
				color: white;
			}

			.btn-primary:hover {
				background: var(--primary-dark);
				transform: translateY(-1px);
				box-shadow: var(--shadow-md);
			}

			.btn-secondary {
				background: var(--text-secondary);
				color: white;
			}

			.btn-secondary:hover {
				background: var(--text-primary);
				transform: translateY(-1px);
				box-shadow: var(--shadow-md);
			}

			.btn-success {
				background: var(--success-color);
				color: white;
			}

			.btn-success:hover {
				background: #059669;
				transform: translateY(-1px);
				box-shadow: var(--shadow-md);
			}

			.action-buttons {
				display: flex;
				gap: 0.5rem;
				margin-top: auto;
				flex-shrink: 0;
			}

			/* Schema Fields - REVERTED TO ORIGINAL */
			.schema-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 1rem;
			}

			.schema-controls {
				display: flex;
				gap: 0.5rem;
				align-items: center;
			}

			.schema-info {
				color: var(--text-secondary);
				font-size: 0.875rem;
			}

			.schema-table-header {
				display: grid;
				grid-template-columns: 2fr 3fr 1fr 1fr 1fr;
				gap: 1rem;
				padding: 0.75rem 1rem;
				background: var(--background);
				border: 1px solid var(--border-color);
				border-radius: var(--radius-md) var(--radius-md) 0 0;
				font-weight: 600;
				font-size: 0.875rem;
				color: var(--text-secondary);
			}

			.schema-fields-container {
				border: 1px solid var(--border-color);
				border-top: none;
				border-radius: 0 0 var(--radius-md) var(--radius-md);
				max-height: 400px;
				overflow-y: auto;
			}

			.schema-field-row {
				display: grid;
				grid-template-columns: 2fr 3fr 1fr 1fr 1fr;
				gap: 1rem;
				padding: 0.75rem 1rem;
				border-bottom: 1px solid var(--border-color);
				align-items: center;
				transition: background-color 0.2s ease;
			}

			.schema-field-row:hover {
				background: var(--background);
			}

			.schema-field-row:last-child {
				border-bottom: none;
			}

			.field-name-display {
				font-family: "Monaco", "Menlo", "Ubuntu Mono", monospace;
				font-size: 0.8125rem;
				font-weight: 600;
			}

			.field-description {
				font-size: 0.8125rem;
				color: var(--text-secondary);
			}

			.field-type {
				font-family: "Monaco", "Menlo", "Ubuntu Mono", monospace;
				font-size: 0.75rem;
				background: var(--background);
				padding: 0.25rem 0.5rem;
				border-radius: var(--radius-sm);
				color: var(--secondary-color);
				font-weight: 600;
			}

			.field-required-badge {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 1.25rem;
				height: 1.25rem;
				border-radius: 50%;
				font-size: 0.75rem;
				font-weight: 600;
			}

			.field-required-badge.required {
				background: var(--danger-color);
				color: white;
			}

			.field-required-badge.optional {
				background: var(--text-secondary);
				color: white;
			}

			.empty-schema-message {
				text-align: center;
				padding: 3rem 1rem;
				color: var(--text-secondary);
			}

			.empty-schema-message svg {
				width: 3rem;
				height: 3rem;
				margin: 0 auto 1rem;
				opacity: 0.5;
			}

			/* Alerts */
			.alert {
				position: fixed;
				top: 2rem;
				right: 2rem;
				padding: 1rem 1.5rem;
				border-radius: var(--radius-md);
				box-shadow: var(--shadow-lg);
				z-index: 1000;
				display: flex;
				align-items: center;
				gap: 0.75rem;
				max-width: 400px;
				animation: slideIn 0.3s ease;
			}

			@keyframes slideIn {
				from {
					transform: translateX(100%);
					opacity: 0;
				}
				to {
					transform: translateX(0);
					opacity: 1;
				}
			}

			.alert.success {
				background: var(--success-color);
				color: white;
			}

			.alert.error {
				background: var(--danger-color);
				color: white;
			}

			.alert.warning {
				background: var(--warning-color);
				color: white;
			}

			/* Responsive Design */
			@media (max-width: 768px) {
				.container {
					padding: 1rem;
				}

				.header-title {
					font-size: 2rem;
				}

				.form-selector-container {
					flex-direction: column;
					gap: 0.75rem;
				}

				.schema-table-header,
				.schema-field-row {
					grid-template-columns: 1fr;
					gap: 0.5rem;
				}

				.fields-grid {
					grid-template-columns: 1fr;
				}

				.action-buttons {
					flex-direction: column;
				}

				.voice-questions-panel .panel-body,
				.json-config-panel .panel-body {
					max-height: 400px;
				}
			}
		</style>
	</head>
	<body>
		<div id="loading" class="loading">
			<div class="loading-spinner"></div>
			<p style="margin-top: 1rem; font-weight: 500">Processing...</p>
		</div>

		<div class="container">
			<div class="header">
				<h1 class="header-title">Form Configuration Manager</h1>
				<p class="header-subtitle">
					Manage voice questions, form fields, and output schemas for different
					form types
				</p>
			</div>

			<!-- Form Type Selector -->
			<div class="form-selector-section">
				<div class="form-selector-container">
					<div class="form-selector-wrapper">
						<label class="form-selector-label" for="formTypeSelect"
							>Form Type:</label
						>
						<select
							id="formTypeSelect"
							class="form-selector-select"
							onchange="loadFormQuestions()"
						>
							{% for form_type in form_types %}
							<option value="{{ form_type }}">
								{{ form_config[form_type].title }}
							</option>
							{% endfor %}
						</select>
						<div class="form-info-inline">
							<svg
								class="form-info-inline-icon icon-sm"
								fill="currentColor"
								viewBox="0 0 20 20"
							>
								<path
									fill-rule="evenodd"
									d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
									clip-rule="evenodd"
								/>
							</svg>
							<span class="form-info-inline-text" id="formFieldCount"
								>Loading...</span
							>
						</div>
					</div>
				</div>
			</div>

			<!-- Fields Panel (NEW) -->
			<div class="panel fields-panel">
				<div class="panel-header">
					<h2 class="panel-title">
						<svg
							class="icon-md"
							fill="none"
							stroke="currentColor"
							viewBox="0 0 24 24"
						>
							<path
								stroke-linecap="round"
								stroke-linejoin="round"
								stroke-width="2"
								d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
							/>
						</svg>
						Form Fields
					</h2>
				</div>
				<div class="panel-body">
					<div id="fieldsGrid" class="fields-grid">
						<!-- Fields will be loaded here -->
					</div>
					<div class="action-buttons">
						<button class="btn btn-primary" onclick="addNewField()">
							<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
								<path
									fill-rule="evenodd"
									d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
									clip-rule="evenodd"
								/>
							</svg>
							Add Field
						</button>
						<button class="btn btn-secondary" onclick="saveFields()">
							<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
								<path
									d="M7.707 10.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V6h5a2 2 0 012 2v7a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2h5v5.586l-1.293-1.293zM9 4a1 1 0 012 0v2H9V4z"
								/>
							</svg>
							Save Fields
						</button>
					</div>
				</div>
			</div>

			<!-- Main Grid -->
			<div class="main-grid">
				<!-- JSON Configuration Panel (UPDATED) -->
				<div class="panel json-config-panel">
					<div class="panel-header">
						<h2 class="panel-title">
							<svg
								class="icon-md"
								fill="none"
								stroke="currentColor"
								viewBox="0 0 24 24"
							>
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
								/>
							</svg>
							JSON Configuration - <span id="currentFormTitle">Loading...</span>
						</h2>
					</div>
					<div class="panel-body">
						<textarea
							id="jsonEditor"
							class="json-editor"
							placeholder="Form configuration will be loaded here..."
						></textarea>
						<div class="action-buttons">
							<button
								class="btn btn-primary"

							>
								<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
									<path
										d="M7.707 10.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V6h5a2 2 0 012 2v7a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2h5v5.586l-1.293-1.293zM9 4a1 1 0 012 0v2H9V4z"
									/>
								</svg>
								Save This Form
							</button>
							<button class="btn btn-secondary" onclick="resetCurrentForm()">
								<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
									<path
										fill-rule="evenodd"
										d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z"
										clip-rule="evenodd"
									/>
								</svg>
								Reset
							</button>
						</div>
					</div>
				</div>

				<!-- Voice Questions Panel -->
				<div class="panel voice-questions-panel">
					<div class="panel-header">
						<h2 class="panel-title">
							<svg
								class="icon-md"
								fill="none"
								stroke="currentColor"
								viewBox="0 0 24 24"
							>
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
								/>
							</svg>
							Voice Questions
						</h2>
					</div>
					<div class="panel-body">
						<div class="questions-header">
							<div class="questions-info">
								<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
									<path
										fill-rule="evenodd"
										d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
										clip-rule="evenodd"
									/>
								</svg>
								Drag to reorder questions
							</div>
							<button class="add-question-btn" onclick="addNewQuestion()">
								<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
									<path
										fill-rule="evenodd"
										d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
										clip-rule="evenodd"
									/>
								</svg>
								Add Question
							</button>
						</div>

						<div id="questionsContainer" class="questions-container">
							<!-- Questions will be rendered here -->
						</div>

						<div class="action-buttons">
							<button class="btn btn-success" onclick="saveQuestions()">
								<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
									<path
										d="M7.707 10.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V6h5a2 2 0 012 2v7a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2h5v5.586l-1.293-1.293zM9 4a1 1 0 012 0v2H9V4z"
									/>
								</svg>
								Save Questions
							</button>
						</div>
					</div>
				</div>

				<!-- Output Schema Panel -->
				<div class="panel output-schema-panel">
					<div class="panel-header">
						<h2 class="panel-title">
							<svg
								class="icon-md"
								fill="none"
								stroke="currentColor"
								viewBox="0 0 24 24"
							>
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
								/>
							</svg>
							Output Schema
						</h2>
					</div>
					<div class="panel-body">
						<div class="schema-header">
							<div class="schema-controls">
								<button class="btn btn-secondary" onclick="addSchemaField()">
									<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
										<path
											fill-rule="evenodd"
											d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
											clip-rule="evenodd"
										/>
									</svg>
									Add Field
								</button>
								<button class="btn btn-secondary" onclick="toggleSchemaView()">
									<svg
										class="icon-sm"
										fill="none"
										stroke="currentColor"
										viewBox="0 0 24 24"
									>
										<path
											stroke-linecap="round"
											stroke-linejoin="round"
											stroke-width="2"
											d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
										/>

									View JSON
								</button>
								<div class="schema-info">
									<span id="schemaFieldCount">0 fields</span>
								</div>

						<!-- Schema Fields Table View -->
						<div id="schemaTableView">
							<div class="schema-table-header">
								<div class="schema-col schema-col-name">Parameter Name</div>
								<div class="schema-col schema-col-desc">Description</div>
								<div class="schema-col schema-col-type">Type</div>
								<div class="schema-col schema-col-required">Required</div>
								<div class="schema-col schema-col-actions"></div>
							</div>
							<div id="schemaFieldsContainer" class="schema-fields-container">
								<!-- Schema fields will be rendered here -->
							</div>
						</div>

						<!-- JSON View (hidden by default) -->
						<div id="schemaJsonView" style="display: none">
							<div id="outputSchemaDisplay" class="output-schema-display">
								<pre id="outputSchemaContent">
									<!-- Output schema will be displayed here -->
								</pre>
							</div>
							<textarea
								id="outputSchemaEditor"
								style="display: none"
							></textarea>
						</div>

						<div class="action-buttons">
							<button class="btn btn-primary" onclick="saveOutputSchema()">
								<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
									<path
										d="M7.707 10.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V6h5a2 2 0 012 2v7a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2h5v5.586l-1.293-1.293zM9 4a1 1 0 012 0v2H9V4z"
									/>
								</svg>
								Save Schema
							</button>
							<button
								class="btn btn-secondary"
								onclick="validateOutputSchema()"
							>
								<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
									<path
										fill-rule="evenodd"
										d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
										clip-rule="evenodd"
									/>
								</svg>
								Validate
							</button>
						</div>
					</div>
				</div>

		</div>

		<script>
			let currentQuestions = [];
			let originalConfig = {{ config_data|safe }};
			let currentFormConfig = {};
			let draggedElement = null;
			let draggedIndex = null;

			// Drag and drop handlers
			function handleDragStart(e) {
				draggedElement = this;
				draggedIndex = parseInt(this.dataset.index);
				this.classList.add('dragging');
				e.dataTransfer.effectAllowed = 'move';
				e.dataTransfer.setData('text/html', this.innerHTML);
			}

			function handleDragEnd(e) {
				this.classList.remove('dragging');

				// Remove all drag-over classes
				const allChips = document.querySelectorAll('.question-chip');
				allChips.forEach(chip => chip.classList.remove('drag-over'));
			}

			function handleDragOver(e) {
				if (e.preventDefault) {
					e.preventDefault();
				}
				e.dataTransfer.dropEffect = 'move';
				return false;
			}

			function handleDragEnter(e) {
				this.classList.add('drag-over');
			}

			function handleDragLeave(e) {
				this.classList.remove('drag-over');
			}

			function handleDrop(e) {
				if (e.stopPropagation) {
					e.stopPropagation();
				}

				const dropIndex = parseInt(this.dataset.index);

				if (draggedIndex !== dropIndex) {
					// Move the question in the array
					const question = currentQuestions.splice(draggedIndex, 1)[0];
					currentQuestions.splice(dropIndex, 0, question);

					// Re-render questions
					renderQuestions();
				}

				return false;
			}

			// Load questions for the selected form type
			function loadFormQuestions() {
				const formType = document.getElementById('formTypeSelect').value;
				const formConfig = originalConfig.FORM_CONFIG[formType];
				currentFormConfig = JSON.parse(JSON.stringify(formConfig)); // Deep copy

				// Update form field count
				const fieldCount = Object.keys(formConfig.fields).length;
				document.getElementById('formFieldCount').textContent = `${fieldCount} fields configured`;

				// Update current form title
				document.getElementById('currentFormTitle').textContent = formConfig.title || formType;

				// Load questions
				currentQuestions = formConfig.voice_questions || [];
				renderQuestions();

				// Load form fields
				loadFormFields(formConfig.fields);

				// Load current form JSON (only this form, not entire config)
				document.getElementById('jsonEditor').value = JSON.stringify(currentFormConfig, null, 2);

				// Load output schema
				const outputSchema = formConfig.output_schema || {};
				const schemaContent = document.getElementById('outputSchemaContent');
				schemaContent.textContent = JSON.stringify(outputSchema, null, 2);

				// Load schema fields into table view
				loadSchemaFields(outputSchema);
			}

			// Load form fields into the new Fields panel
			function loadFormFields(fields) {
				const container = document.getElementById('fieldsGrid');
				container.innerHTML = '';

				Object.entries(fields).forEach(([fieldName, fieldConfig]) => {
					const fieldCard = createFieldCard(fieldName, fieldConfig);
					container.appendChild(fieldCard);
				});
			}

			function createFieldCard(fieldName, fieldConfig) {
				const card = document.createElement('div');
				card.className = 'field-card';

				const required = fieldConfig.required;
				const requiredBadge = required ?
					'<span class="field-required">Required</span>' :
					'<span class="field-optional">Optional</span>';

				const options = fieldConfig.options ?
					`<div class="field-detail">
						<span class="field-detail-label">Options:</span>
						<span class="field-detail-value">${fieldConfig.options.join(', ')}</span>
					</div>` : '';

				card.innerHTML = `
					<div class="field-header">
						<span class="field-name">${fieldName}</span>
						${requiredBadge}
					</div>
					<div class="field-details">
						<div class="field-detail">
							<span class="field-detail-label">Label:</span>
							<span class="field-detail-value">${fieldConfig.label}</span>
						</div>
						<div class="field-detail">
							<span class="field-detail-label">Type:</span>
							<span class="field-detail-value field-type-select">${fieldConfig.type}</span>
						</div>
						${options}
					</div>
				`;

				return card;
			}

			// Load schema fields into table view
			function loadSchemaFields(schema) {
				const container = document.getElementById('schemaFieldsContainer');
				container.innerHTML = '';

				const properties = schema.properties || {};
				const required = schema.required || [];
				const fields = Object.entries(properties);

				// Update field count
				document.getElementById('schemaFieldCount').textContent = `${fields.length} field${fields.length !== 1 ? 's' : ''}`;

				if (fields.length === 0) {
					container.innerHTML = `
						<div class="empty-schema-message">
							<svg fill="currentColor" viewBox="0 0 20 20">
								<path fill-rule="evenodd" d="M5 3a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2V5a2 2 0 00-2-2H5zm0 2h10v10H5V5z" clip-rule="evenodd"/>
							</svg>
							<p>No fields defined yet</p>
							<p style="font-size: 0.875rem; margin-top: 0.5rem;">Click "Add Field" to create your first schema field</p>
						</div>
					`;
					return;
				}

				fields.forEach(([fieldName, fieldConfig], index) => {
					const isRequired = required.includes(fieldName);
					const fieldRow = createSchemaFieldRow(fieldName, fieldConfig, isRequired, index);
					container.appendChild(fieldRow);
				});
			}

			function createSchemaFieldRow(fieldName, fieldConfig, isRequired, index) {
				const row = document.createElement('div');
				row.className = 'schema-field-row';
				row.dataset.fieldName = fieldName;

				const requiredBadge = isRequired ?
					'<span class="field-required-badge required">R</span>' :
					'<span class="field-required-badge optional">O</span>';

				row.innerHTML = `
					<div class="field-name-display">${fieldName}</div>
					<div class="field-description">${fieldConfig.description || 'No description'}</div>
					<div class="field-type">${fieldConfig.type || 'string'}</div>
					<div>${requiredBadge}</div>
					<div>
						<button class="btn-icon edit" onclick="editSchemaField('${fieldName}')" title="Edit">
							<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
								<path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
							</svg>
						</button>
						<button class="btn-icon delete" onclick="deleteSchemaField('${fieldName}')" title="Delete">
							<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
								<path fill-rule="evenodd" d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" clip-rule="evenodd"/>
								<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
							</svg>
						</button>
					</div>
				`;

				return row;
			}

			function renderQuestions() {
				const container = document.getElementById('questionsContainer');
				container.innerHTML = '';

				if (currentQuestions.length === 0) {
					container.innerHTML = `
						<div style="text-align: center; padding: 2rem; color: var(--text-secondary);">
							<svg style="width: 3rem; height: 3rem; margin-bottom: 1rem; opacity: 0.5;" fill="currentColor" viewBox="0 0 20 20">
								<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
							</svg>
							<p>No voice questions configured yet</p>
							<p style="font-size: 0.875rem; margin-top: 0.5rem;">Click "Add Question" to create your first voice question</p>
						</div>
					`;
					return;
				}

				currentQuestions.forEach((question, index) => {
					const questionChip = createQuestionChip(question, index);
					container.appendChild(questionChip);
				});
			}

			function createQuestionChip(question, index) {
				const chip = document.createElement('div');
				chip.className = 'question-chip';
				chip.dataset.index = index;
				chip.draggable = true;

				chip.innerHTML = `
					<div class="question-content">
						<div class="question-number">${index + 1}</div>
						<div class="question-text">${question}</div>
						<div class="question-actions">
							<button class="btn-icon edit" onclick="editQuestion(${index})" title="Edit question">
								<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
									<path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
								</svg>
							</button>
							<button class="btn-icon delete" onclick="deleteQuestion(${index})" title="Delete question">
								<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
									<path fill-rule="evenodd" d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" clip-rule="evenodd"/>
									<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
								</svg>
							</button>
						</div>
					</div>
				`;

				// Add drag and drop event listeners
				chip.addEventListener('dragstart', handleDragStart);
				chip.addEventListener('dragend', handleDragEnd);
				chip.addEventListener('dragover', handleDragOver);
				chip.addEventListener('dragenter', handleDragEnter);
				chip.addEventListener('dragleave', handleDragLeave);
				chip.addEventListener('drop', handleDrop);

				return chip;
			}

			// Question management functions
			function addNewQuestion() {
				const question = prompt('Enter the new voice question:');
				if (question && question.trim()) {
					currentQuestions.push(question.trim());
					renderQuestions();
				}
			}

			function editQuestion(index) {
				const currentQuestion = currentQuestions[index];
				const newQuestion = prompt('Edit question:', currentQuestion);
				if (newQuestion !== null && newQuestion.trim()) {
					currentQuestions[index] = newQuestion.trim();
					renderQuestions();
				}
			}

			function deleteQuestion(index) {
				if (confirm('Are you sure you want to delete this question?')) {
					currentQuestions.splice(index, 1);
					renderQuestions();
				}
			}

			// Save current form configuration (not entire config)
			function saveCurrentFormConfiguration() {
				try {
					const formType = document.getElementById('formTypeSelect').value;
					const configText = document.getElementById('jsonEditor').value;
					const config = JSON.parse(configText);

					showLoading();

					// Save this specific form configuration
					fetch(`/prompt-config/form-config/${formType}`, {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
						},
						body: JSON.stringify(config)
					})
					.then(response => response.json())
					.then(data => {
						hideLoading();
						if (data.error) {
							showAlert('error', data.error);
						} else {
							showAlert('success', 'Form configuration saved successfully');
							// Update the current form config
							currentFormConfig = config;
							// Reload the form data
							loadFormQuestions();
						}
					})
					.catch(error => {
						hideLoading();
						showAlert('error', 'Failed to save configuration: ' + error.message);
					});
				} catch (error) {
					hideLoading();
					showAlert('error', 'Invalid JSON format: ' + error.message);
				}
			}

			function resetCurrentForm() {
				if (confirm('Are you sure you want to reset this form to its original configuration?')) {
					loadFormQuestions();
					showAlert('success', 'Form configuration reset');
				}
			}

			// Save questions
			function saveQuestions() {
				const formType = document.getElementById('formTypeSelect').value;

				showLoading();

				fetch(`/prompt-config/update-questions/${formType}`, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({questions: currentQuestions})
				})
				.then(response => response.json())
				.then(data => {
					hideLoading();
					if (data.error) {
						showAlert('error', data.error);
					} else {
						showAlert('success', 'Voice questions saved successfully');
						// Update current config and JSON editor
						currentFormConfig.voice_questions = currentQuestions;
						document.getElementById('jsonEditor').value = JSON.stringify(currentFormConfig, null, 2);
					}
				})
				.catch(error => {
					hideLoading();
					showAlert('error', 'Failed to save questions: ' + error.message);
				});
			}

			// Schema management functions
			function addSchemaField() {
				const fieldName = prompt('Enter field name:');
				if (!fieldName || !fieldName.trim()) return;

				const description = prompt('Enter field description:');
				const type = prompt('Enter field type (string, boolean, number):', 'string');
				const isRequired = confirm('Is this field required?');

				// Get current schema
				const formType = document.getElementById('formTypeSelect').value;
				const outputSchema = currentFormConfig.output_schema || {type: 'object', properties: {}, required: []};

				// Add new field
				outputSchema.properties[fieldName.trim()] = {
					type: type || 'string',
					description: description || ''
				};

				if (isRequired && !outputSchema.required.includes(fieldName.trim())) {
					outputSchema.required.push(fieldName.trim());
				}

				// Update current config
				currentFormConfig.output_schema = outputSchema;

				// Refresh displays
				document.getElementById('outputSchemaContent').textContent = JSON.stringify(outputSchema, null, 2);
				document.getElementById('jsonEditor').value = JSON.stringify(currentFormConfig, null, 2);
				loadSchemaFields(outputSchema);
			}

			function editSchemaField(fieldName) {
				// Implementation for editing schema fields
				showAlert('warning', 'Edit functionality coming soon - use JSON editor for now');
			}

			function deleteSchemaField(fieldName) {
				if (confirm(`Are you sure you want to delete the field "${fieldName}"?`)) {
					const outputSchema = currentFormConfig.output_schema || {type: 'object', properties: {}, required: []};

					// Remove from properties and required
					delete outputSchema.properties[fieldName];
					outputSchema.required = outputSchema.required.filter(f => f !== fieldName);

					// Update current config
					currentFormConfig.output_schema = outputSchema;

					// Refresh displays
					document.getElementById('outputSchemaContent').textContent = JSON.stringify(outputSchema, null, 2);
					document.getElementById('jsonEditor').value = JSON.stringify(currentFormConfig, null, 2);
					loadSchemaFields(outputSchema);
				}
			}

			function saveOutputSchema() {
				const formType = document.getElementById('formTypeSelect').value;
				const outputSchema = currentFormConfig.output_schema || {};

				showLoading();

				fetch(`/prompt-config/update-output-schema/${formType}`, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({output_schema: outputSchema})
				})
				.then(response => response.json())
				.then(data => {
					hideLoading();
					if (data.error) {
						showAlert('error', data.error);
					} else {
						showAlert('success', 'Output schema saved successfully');
					}
				})
				.catch(error => {
					hideLoading();
					showAlert('error', 'Failed to save schema: ' + error.message);
				});
			}

			function validateOutputSchema() {
				try {
					const outputSchema = currentFormConfig.output_schema || {};

					// Basic validation
					if (!outputSchema.type || outputSchema.type !== 'object') {
						throw new Error('Schema must be of type "object"');
					}

					if (!outputSchema.properties || typeof outputSchema.properties !== 'object') {
						throw new Error('Schema must have a "properties" object');
					}

					if (outputSchema.required && !Array.isArray(outputSchema.required)) {
						throw new Error('Required field must be an array');
					}

					// Check that all required fields exist in properties
					for (const requiredField of outputSchema.required) {
						if (!outputSchema.properties[requiredField]) {
							throw new Error(`Required field "${requiredField}" not found in properties`);
						}
					}

					showAlert('success', 'Schema is valid!');
				} catch (error) {
					showAlert('error', 'Schema validation failed: ' + error.message);
				}
			}

			function toggleSchemaView() {
				const tableView = document.getElementById('schemaTableView');
				const jsonView = document.getElementById('schemaJsonView');

				if (tableView.style.display === 'none') {
					tableView.style.display = 'block';
					jsonView.style.display = 'none';
				} else {
					tableView.style.display = 'none';
					jsonView.style.display = 'block';
				}
			}

			// Fields management (placeholder functions)
			function addNewField() {
				showAlert('warning', 'Add field functionality coming soon - use JSON editor for now');
			}

			function saveFields() {
				showAlert('warning', 'Save fields functionality coming soon - use JSON editor for now');
			}

			// Utility functions
			function showAlert(type, message) {
				const alert = document.createElement('div');
				alert.className = `alert ${type}`;
				alert.innerHTML = `
					<svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
						<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
					</svg>
					<span>${message}</span>
				`;

				document.body.appendChild(alert);

				setTimeout(() => {
					alert.remove();
				}, 5000);
			}

			function showLoading() {
				document.getElementById('loading').style.display = 'flex';
			}

			function hideLoading() {
				document.getElementById('loading').style.display = 'none';
			}

			// Initialize on page load
			document.addEventListener('DOMContentLoaded', function() {
				// Load saved form type selection
				const savedFormType = localStorage.getItem('selectedFormType');
				if (savedFormType) {
					const formTypeSelect = document.getElementById('formTypeSelect');
					const optionExists = Array.from(formTypeSelect.options).some(option => option.value === savedFormType);
					if (optionExists) {
						formTypeSelect.value = savedFormType;
					}
				}

				loadFormQuestions();

				// Save form type selection to localStorage when changed
				document.getElementById('formTypeSelect').addEventListener('change', function() {
					localStorage.setItem('selectedFormType', this.value);
				});
			});
		</script>
	</body>
</html>
