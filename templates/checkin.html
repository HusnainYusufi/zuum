<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Details - Transit Chat</title>
    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="stylesheet" href="/static/css/App.css">
    <link rel="stylesheet" href="/static/css/checkin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="root">
        <div class="App">
            <div class="transcript-page">
                <div class="transcript-header">
                    <div class="header-left">
                        <button class="back-button" onclick="window.location.href='/'">
                            <i class="fas fa-arrow-left"></i> Back to Dashboard
                        </button>
                        <h1>
                            <!-- <i class="fas fa-comment-dots page-icon"></i> -->
                            <span id="page-title">Call Transcript - Check-in #00</span>
                        </h1>
                    </div>
                    <div class="header-right">
                        <button class="feedback-button header-feedback" id="feedback-button">
                            <i class="fas fa-comment-alt"></i> Provide Feedback
                        </button>
                    </div>
                </div>

                <div class="transcript-container">
                    <!-- Top Row: Overview with AI Summary -->
                    <div class="overview-section">
                        <div class="overview-card info-card">
                            <div class="card-header">
                                <h3><i class="fas fa-info-circle section-icon"></i> Check-in Details</h3>
                            </div>
                            <div class="info-grid" id="checkin-details">
                                <!-- Details will be populated by JavaScript -->
                            </div>
                        </div>

                        <div class="overview-card status-card">
                            <div class="card-header">
                                <h3><i class="fas fa-flag section-icon"></i> Status Information</h3>
                            </div>
                            <div class="status-grid" id="status-info">
                                <!-- Status will be populated by JavaScript -->
                            </div>
                        </div>

                        <div class="overview-card summary-card" id="ai-summary-card" style="display: none;">
                            <div class="card-header">
                                <h3><i class="fas fa-robot section-icon"></i> AI Summary</h3>
                            </div>
                            <div class="summary-content" id="ai-summary-content">
                                <!-- Summary will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>

                    <!-- Main Content Row -->
                    <div class="main-content-section">
                        <!-- Left: Transcript -->
                        <div class="transcript-main">
                            <div class="transcript-card">
                                <div class="card-header">
                                    <h3><i class="fas fa-comment-dots section-icon"></i> Call Transcript</h3>
                                </div>
                                <div class="transcript-content" id="transcript-content">
                                    <!-- Transcript will be populated by JavaScript -->
                                </div>
                            </div>
                        </div>

                        <!-- Right: Check-in Results & Feedback -->
                        <div class="results-section">
                            <div class="output-card" id="output-card" style="display: none;">
                                <div class="card-header">
                                    <h3><i class="fas fa-check-circle section-icon"></i> Check-in Results</h3>
                                </div>
                                <div class="output-content" id="output-content">
                                    <!-- Output data will be populated by JavaScript -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading spinner -->
    <div id="loading-container" class="dashboard-container" style="display: none;">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p id="loading-message">Loading transcript...</p>
        </div>
    </div>

    <!-- Call in progress overlay -->
    <div id="call-progress-overlay" class="call-progress-overlay" style="display: none;">
        <div class="call-progress-content">
            <div class="call-progress-spinner">
                <div class="spinner"></div>
            </div>
            <h2>Call in Progress</h2>
            <p>Please wait while the call is being processed...</p>
            <div class="progress-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div>

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modal-close">&times;</span>
            <h2>Feedback Form</h2>
            <form id="feedback-form">
                <div class="form-group">
                    <h3>Feedback Type</h3>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="feedbackType" value="comments" checked>
                            Comments
                        </label>
                        <label>
                            <input type="radio" name="feedbackType" value="suggestions">
                            Suggestions
                        </label>
                        <label>
                            <input type="radio" name="feedbackType" value="questions">
                            Questions
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <h3>Describe Your Feedback</h3>
                    <textarea name="feedbackDescription" required placeholder="Please describe your feedback here..."></textarea>
                </div>

                <div class="form-group">
                    <h3>Images (Optional)</h3>
                    <input type="file" name="feedbackImages" multiple accept="image/*">
                </div>

                <div class="form-group">
                    <h3>Name</h3>
                    <input type="text" name="userName" required placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <h3>Email</h3>
                    <input type="email" name="userEmail" required placeholder="Enter your email">
                </div>

                <button type="submit" class="submit-button">Submit Feedback</button>
            </form>
        </div>
    </div>

    <script src="/static/js/checkin.js"></script>
    <script src="/static/js/feedback.js"></script>
</body>
</html>
