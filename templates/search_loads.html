<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Shipments</title>
  <link rel="stylesheet" href="/static/css/checkin_dashboard.css">
  <link rel="stylesheet" href="/static/css/all_checkin.css">
  <link rel="stylesheet" href="/static/css/search_loads.css?v=2" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  </head>
<body>
  <div class="all-checkins-container">
    <!-- Header -->
    <div class="all-checkins-header">
      <h1 class="all-checkins-title">
        <i class="fas fa-search"></i>
        Search Shipments
      </h1>
      <a href="/dashboard" class="back-button">
        <i class="fas fa-arrow-left"></i>
        Back to Dashboard
      </a>
    </div>

    <!-- Quick Search Bar -->
    <div class="quick-filters">
      <div class="quick-controls">
        <label class="filter-label">Quick Search</label>
        <div class="quick-row">
          <select id="quick-field" class="filter-input quick-select">
            <option value="job_id" selected>Job ID</option>
            <option value="load_id">Load ID</option>
            <option value="shipment_id">Shipment ID</option>
            <option value="tenant_id">Tenant ID</option>
            <option value="fleet_phone">Fleet Phone</option>
          </select>
          <input id="quick-value" type="text" class="filter-input quick-input" placeholder="Enter value..." />
          <select id="sort-select" class="filter-input quick-select" title="Sort by last update">
            <option value="desc" selected>Recently updated</option>
            <option value="asc">Oldest updated</option>
          </select>
          <button id="quick-search-button" class="back-button">
            <i class="fas fa-search"></i>
            Search
          </button>
          <button id="clear-filters" type="button" class="btn-secondary">
            <i class="fas fa-eraser"></i>
            Clear
          </button>
          <button id="toggle-advanced" type="button" class="btn-secondary">
            <i class="fas fa-sliders-h"></i>
            More Filters
          </button>
        </div>
      </div>
    </div>

    <!-- Filters/Form -->
    <form id="search-form" class="all-checkins-filters advanced-filters" style="display: none;">
      <div class="filter-group">
        <label class="filter-label">Tenant ID</label>
        <input type="text" class="filter-input" name="tenant_id" />
      </div>
      <div class="filter-group">
        <label class="filter-label">Shipment ID</label>
        <input type="text" class="filter-input" name="shipment_id" />
      </div>
      <div class="filter-group">
        <label class="filter-label">Load ID</label>
        <input type="text" class="filter-input" name="load_id" />
      </div>
      <div class="filter-group">
        <label class="filter-label">Job ID</label>
        <input type="text" class="filter-input" name="job_id" />
      </div>
      <div class="filter-group">
        <label class="filter-label">Fleet Phone</label>
        <input type="text" class="filter-input" name="fleet_phone" />
      </div>
      <div class="filter-group">
        <label class="filter-label">Fleet Name</label>
        <input type="text" class="filter-input" name="fleet_name" />
      </div>
      <div class="filter-group">
        <label class="filter-label">Customer Name</label>
        <input type="text" class="filter-input" name="customer_name" />
      </div>
      <div class="filter-group">
        <label class="filter-label">Carrier ID</label>
        <input type="text" class="filter-input" name="carrier_id" />
      </div>
      <div class="filter-group">
        <label class="filter-label">Limit</label>
        <input type="number" class="filter-input" name="limit" value="10" min="1" max="50" />
      </div>

      <div class="actions">
        <span id="error" class="error"></span>
      </div>
    </form>

    <!-- Results -->
    <div class="all-checkins-list">
      <div class="results-toolbar">
        <span id="results-summary" class="page-info"></span>
      </div>
      <div class="all-checkins-content">
        <table id="results-table" class="results-table">
          <thead>
            <tr>
              <th>Tenant</th>
              <th>Shipment</th>
              <th>Load</th>
              <th>Job ID</th>
              <th>Fleet Name</th>
              <th>Fleet Phone</th>
              <th>Customer</th>
              <th>Carrier</th>
              <th>Updated</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="pagination" class="all-checkins-pagination"></div>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loads-loading" class="loading-overlay" style="display:none;">
    <div class="spinner"></div>
    <p>Searching loads...</p>
  </div>

  <script src="/static/js/search_loads.js"></script>
  <script>
    document.querySelector('input[name="tenant_id"]').focus();
  </script>
  </body>
  </html>
